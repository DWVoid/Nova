[package]
name = "nova-run"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nvrun"
path = "src/main.rs"

[dependencies]
nova-analyze     = { path = "../nova-analyze" }
serde            = { workspace = true }
clap             = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
